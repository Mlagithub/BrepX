<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrepX · 工业 CAD & CFD 几何工作台</title>
  <link rel="stylesheet" href="./style.css?v=10">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- 顶部主导航栏 -->
    <header class="navbar" role="banner">
      <div class="nav-brand">
        <button class="nav-btn icon-only" id="btn-toggle-left-panel" title="折叠/展开左侧建模工具箱 (快捷键: T)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span class="brand-title">BrepX</span>
        <span class="brand-badge">B-Rep Native CAD</span>
      </div>

      <div class="nav-toolbar" role="toolbar" aria-label="建模与视口主工具栏">
        <div class="btn-group select-mode-group" id="selection-mode-group">
          <button class="nav-btn active" data-sel-mode="face" title="面模式 (快捷键: 3)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polygon points="12 2 2 7 12 12 22 7" fill="currentColor" fill-opacity="0.3"/></svg>
            <span>面</span><span class="btn-key-badge">3</span>
          </button>
          <button class="nav-btn" data-sel-mode="edge" title="边模式 (快捷键: 2)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><line x1="12" y1="2" x2="22" y2="7" stroke-width="3.5"/></svg>
            <span>边</span><span class="btn-key-badge">2</span>
          </button>
          <button class="nav-btn" data-sel-mode="vertex" title="点模式 (快捷键: 1)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><circle cx="12" cy="2" r="2.5" fill="currentColor"/></svg>
            <span>点</span><span class="btn-key-badge">1</span>
          </button>
        </div>

        <div class="btn-divider"></div>

        <div class="btn-group">
          <button class="nav-btn" id="btn-undo" title="撤销 (Ctrl+Z)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            撤销
          </button>
          <button class="nav-btn" id="btn-redo" title="重做 (Ctrl+Y)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
            重做
          </button>
        </div>

        <div class="btn-divider"></div>

        <div class="btn-group">
          <button class="nav-btn active" id="btn-iso" title="等轴测视图">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>等轴测</span>
          </button>
          <button class="nav-btn" id="btn-front" title="正视图">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
            <span>正视</span>
          </button>
          <button class="nav-btn" id="btn-top" title="俯视图">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 9 12 16 22 9"/></svg>
            <span>俯视</span>
          </button>
          <button class="nav-btn" id="btn-right" title="右视图">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="10 8 14 12 10 16"/></svg>
            <span>右视</span>
          </button>
          <button class="nav-btn" id="btn-normal-to" title="正视于选定面 (快捷键: Ctrl+8)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="20" x2="21" y2="20"/><line x1="12" y1="20" x2="12" y2="4"/><polyline points="8 8 12 4 16 8"/></svg>
            <span>垂直面</span>
          </button>
          <button class="nav-btn" id="btn-fit" title="全景居中适应">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <span>适应</span>
          </button>
        </div>

        <div class="btn-divider"></div>

        <div class="btn-group">
          <button class="nav-btn" id="btn-datum-toggle" title="三维正交基准面开关">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><ellipse cx="12" cy="12" rx="9" ry="5" stroke-dasharray="2 2"/></svg>
            <span>基准面</span>
          </button>
          <button class="nav-btn" id="btn-section-toggle" title="动态剖切视图开关">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" fill-opacity="0.2"/></svg>
            <span>剖切</span>
          </button>
          <button class="nav-btn" id="btn-measure-toggle" title="空间测量卡尺">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20"/><path d="M6 12V8"/><path d="M10 12V9"/><path d="M14 12V8"/><path d="M18 12V9"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
            <span>卡尺</span>
          </button>
          <button class="nav-btn" id="btn-xray-toggle" title="X-Ray 透视 (Alt+Z)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/><polyline points="3 9 12 15 21 9"/></svg>
            <span>透视</span>
          </button>
        </div>

        <div class="btn-divider"></div>

        <div class="btn-group export-group">
          <button class="nav-btn btn-highlight" id="btn-export-step" title="导出工业级标准 STEP">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>导出 STEP</span>
          </button>
          <button class="nav-btn" id="btn-export-stl" title="导出 STL">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 19 22 19"/></svg>
            <span>STL</span>
          </button>
          <button class="nav-btn" id="btn-export-dxf" title="导出 DXF 截面">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/></svg>
            <span>DXF</span>
          </button>
          <button class="nav-btn" id="btn-export-cfd" title="导出 CFD 边界字典 (JSON)">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>CFD 字典</span>
          </button>
        </div>
      </div>

      <button class="nav-btn icon-only" id="btn-toggle-right-panel" title="折叠/展开右侧面板 (快捷键: N)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
    </header>

    <main class="main-container">
      <!-- 左侧建模工具箱 (T-Panel) 与多实体树 -->
      <aside class="sidebar left-toolbar-panel" id="left-sidebar">
        <div id="bodies-tree-container"></div>
        <div class="section-divider"></div>
        <div id="toolbar-container"></div>
      </aside>

      <!-- 中央三维视口与底部时间线 -->
      <section class="viewport-wrapper">
        <div id="viewport" class="canvas-container"></div>

        <div class="viewport-hud">
          <div class="hud-mode" id="hud-mode-tag">
            <span class="hud-pill hud-pill-edit">● 编辑模式: 面 [3]</span>
          </div>
          <div class="hud-shortcuts">
            <span class="hud-key-hint"><kbd>左键</kbd> 旋转</span>
            <span class="hud-key-hint"><kbd>右键/中键</kbd> 平移</span>
            <span class="hud-key-hint"><kbd>滚轮</kbd> 缩放</span>
            <span class="hud-key-hint"><kbd>E/Ctrl+B</kbd> 模态拉伸/倒角</span>
            <span class="hud-key-hint"><kbd>Shift+A</kbd> 添加</span>
            <span class="hud-key-hint"><kbd>Space</kbd> 搜算子</span>
          </div>
        </div>

        <div id="modal-status-bar" class="modal-status-bar hidden"></div>

        <div id="adjust-last-panel" class="adjust-last-panel hidden">
          <div class="adjust-last-header">
            <span id="adjust-last-title" class="adjust-last-title">微调操作</span>
            <button id="adjust-last-close" class="btn-icon-subtle" title="折叠">✕</button>
          </div>
          <div id="adjust-last-body" class="adjust-last-body"></div>
        </div>

        <!-- 底部 Fusion 360 风格特征时间线 (Timeline) -->
        <div id="timeline-bar-root" class="timeline-bar"></div>
      </section>

      <!-- 右侧综合工作区 (N-Panel) -->
      <aside class="sidebar right-panel" id="right-sidebar">
        <div class="tab-header" role="tablist">
          <button class="tab-btn active" id="tab-btn-agent" data-tab="agent">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
            Agent 副驾
          </button>
          <button class="tab-btn" id="tab-btn-inspect" data-tab="inspect">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
            选区度量
          </button>
          <button class="tab-btn" id="tab-btn-python" data-tab="python">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            Python 源码
          </button>
        </div>

        <div class="tab-pane active" id="tab-agent" role="tabpanel">
          <div id="agent-panel-container"></div>
        </div>

        <div class="tab-pane" id="tab-inspect" role="tabpanel">
          <div id="measure-inspector-container"></div>
        </div>

        <div class="tab-pane" id="tab-python" role="tabpanel">
          <div class="python-viewer-wrap">
            <div class="viewer-header">只读建模代码 (单向映射)</div>
            <textarea id="python-viewer-textarea" class="script-editor" readonly spellcheck="false"></textarea>
          </div>
        </div>
      </aside>
    </main>

    <!-- 底部状态栏 -->
    <footer class="statusbar">
      <div class="status-left">
        <span class="status-indicator"></span>
        <span id="status-text">就绪 · BrepX 已加载</span>
      </div>
      <div class="status-right">
        <span class="status-item">单位: mm</span>
        <span class="status-item" id="info-kernel">SMLib NURBS B-Rep</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./app.js?v=10"></script>
</body>
</html>
