<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cadwork</title>
  <link rel="stylesheet" href="/web/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/web/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "/web/vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <header>
    <div class="brand">cadwork</div>
    <div id="doc-meta" class="meta"></div>
    <div class="actions">
      <button id="btn-new" title="Start an empty document">New</button>
      <button id="btn-sample" title="Append the nine impeller features">Load impeller</button>
      <button id="btn-undo" title="Undo the last edit">Undo</button>
      <a id="btn-step" class="button" href="#" download>STEP</a>
      <a id="btn-cfd" class="button" href="#" download>CFD</a>
      <a id="btn-render" class="button" href="#" target="_blank">Render</a>
    </div>
  </header>

  <main>
    <aside class="panel" id="tree-panel">
      <h2>Features</h2>
      <div class="add-row">
        <select id="add-type"></select>
        <button id="btn-add">Add</button>
      </div>
      <ul id="feature-list"></ul>
    </aside>

    <section id="viewport"></section>

    <aside class="panel" id="side-panel">
      <h2>Parameters</h2>
      <div id="params"></div>
      <div id="preview" hidden></div>
      <h2>Checks</h2>
      <div id="checks"></div>
    </aside>
  </main>

  <footer id="status"></footer>
  <script type="module" src="/web/src/main.js"></script>
</body>
</html>
