# cadwork agent profile: the CAD MCP server, and nothing that can touch the host.
# Every tool below the MCP insert is removed so the agent can only change documents.

- insert:
    - id: mcp-cad
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cad
        transport: streamable-http
        url: 'http://127.0.0.1:8765/mcp/'
        toolCallTimeoutMs: 300000

# No shell, no files, no network, no plugin management, no delegation.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true

# Kept: todo, goal and skill. todo helps the model plan; skill carries the
# impeller guide installed under $DSH_HOME/skills.

