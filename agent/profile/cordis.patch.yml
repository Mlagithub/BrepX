# cadwork agent profile: CAD MCP + read-only host files + skills.
#
# The agent may read skill references and STEP files, but every document write
# goes through the `cad` MCP server.  Shell, web, subagents and plugin
# management are disabled.

- insert:
    - id: mcp-cad
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cad
        transport: streamable-http
        url: 'http://127.0.0.1:8765/mcp/'
        toolCallTimeoutMs: 300000

    # The base bundle does not mount a host filesystem; add the read-only
    # backend and its tools explicitly.
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      config:
        read: true
        readImage: true
        write: false
        edit: false
        applyPatch: false
        readLimit: 2000

# No shell, no network, no plugin management, no delegation.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true

# Kept: todo, goal, ask_user, compact and skill.  The domain plan lives in the
# document (`plan` / `plan_edit`), not in dsh's todo or goal.
