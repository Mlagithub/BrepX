<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BrepX 视口</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e13; color: #c9d6ea;
    font: 12px/1.5 system-ui, sans-serif; overflow: hidden }
  #host { position: absolute; inset: 0 }
  canvas { display: block; width: 100%; height: 100% }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: #5b6b80; text-align: center; pointer-events: none }
  #empty.on { display: flex }
  #empty b { font-size: 15px; color: #8fa3bd; font-weight: 600 }
  #status { position: absolute; left: 10px; bottom: 8px; right: 10px; color: #8fa3bd;
    text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre-wrap }
</style>
<!-- The kernel locates its wasm and worker through import.meta.url, so it must
     load as its own modules rather than a bundle. -->
<script type="importmap">
{"imports": {
  "three": "/pkg/three/build/three.module.js",
  "three/addons/": "/pkg/three/examples/jsm/",
  "@classcad/smlibwasm": "/pkg/@classcad/smlibwasm/dist/index.js",
  "@classcad/smlibwasm/init": "/pkg/@classcad/smlibwasm/dist/init.js",
  "@classcad/smlibpy-three": "/pkg/@classcad/smlibpy-three/dist/index.js",
  "@classcad/smlibpy-three/init": "/pkg/@classcad/smlibpy-three/dist/init.js"
}}
</script>
</head>
<body>
<div id="host"></div>
<div id="empty"><b>空白文档</b><span>描述你要的零件，Agent 会生成第一个里程碑</span></div>
<div id="status">starting…</div>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { STLLoader } from 'three/addons/loaders/STLLoader.js'
import { init } from '@classcad/smlibpy-three/init'

const host = document.getElementById('host')
const statusLine = document.getElementById('status')
const empty = document.getElementById('empty')
const embedded = window.parent !== window
if (embedded) statusLine.style.display = 'none'

const post = (type, payload) => {
  if (!embedded) return
  try { parent.postMessage({ from: 'brepx-viewport', type, ...payload }, '*') } catch (error) { /* detached */ }
}
const say = (text) => {
  statusLine.textContent = text
  post('status', { text })
}

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
host.append(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x0b0e13)
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1e7)
camera.up.set(0, 0, 1)
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
const hemisphere = new THREE.HemisphereLight(0xffffff, 0x2a3140, 1.6)
scene.add(hemisphere)
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2)
keyLight.position.set(160, 220, 180)
scene.add(keyLight)
const fillLight = new THREE.DirectionalLight(0x8899bb, 0.9)
fillLight.position.set(-140, -160, 60)
scene.add(fillLight)

const SOLID_COLOR = new THREE.Color().setHSL(0.58, 0.16, 0.52)
const VIEWS = { iso: [1, -1, 0.78], front: [0, -1, 0], top: [0, 0, 1], right: [1, 0, 0] }

// Palette follows the hosting application so the model does not sit in a dark
// hole inside a light workspace.
const palette = {
  background: '#0b0e13',
  solid: SOLID_COLOR.clone(),
  edge: new THREE.Color(0x5f9fe0),
  ghost: new THREE.Color(0x6fa8ff),
  ghostEdge: new THREE.Color(0x7fb2ff),
  ghostOpacity: 0.13,
  light: 1.6,
  key: 2.2,
  fill: 0.9,
}

const applyPalette = (theme) => {
  if (theme.background) {
    palette.background = theme.background
    scene.background = new THREE.Color(theme.background)
    document.body.style.background = theme.background
  }
  if (theme.foreground) {
    document.body.style.color = theme.foreground
  }
  const isLight = theme.light !== undefined ? Boolean(theme.light) : palette.background !== '#0b0e13'
  if (isLight) {
    palette.solid = new THREE.Color().setHSL(0.58, 0.16, 0.52)
    palette.edge = new THREE.Color(0x2c4a66)
    palette.ghost = new THREE.Color(0x3f78c4)
    palette.ghostEdge = new THREE.Color(0x2d62ad)
    palette.ghostOpacity = 0.18
    palette.light = 1.35
    palette.key = 1.9
    palette.fill = 0.75
  } else {
    palette.solid = new THREE.Color().setHSL(0.58, 0.20, 0.62)
    palette.edge = new THREE.Color(0x5f9fe0)
    palette.ghost = new THREE.Color(0x6fa8ff)
    palette.ghostEdge = new THREE.Color(0x7fb2ff)
    palette.ghostOpacity = 0.13
    palette.light = 1.6
    palette.key = 2.2
    palette.fill = 0.9
  }
  hemisphere.intensity = palette.light
  keyLight.intensity = palette.key
  fillLight.intensity = palette.fill
  rebuildGrid(!isLight)
  if (display) {
    display.traverse((child) => {
      if (!child.isMesh) return
      const solid = child.userData.solidMaterial
      if (solid) solid.color.copy(palette.solid)
      const edges = child.userData.edges
      if (edges?.material) edges.material.color.copy(palette.edge)
    })
  }
  if (ghost) {
    ghost.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.color.copy(palette.ghost)
        child.material.opacity = palette.ghostOpacity
      }
      if (child.isLineSegments && child.material) child.material.color.copy(palette.ghostEdge)
    })
  }
}

let kernel = null
let display = null
let ghost = null
let highlightGroup = null
let previewActive = false
let wire = false
let measureMode = false
let measureA = null
let pickScope = 'face'
let sectionOn = false
let sectionAxis = 'Z'
let sectionT = 0.5
let currentDoc = null
let currentVersion = -1
let hasFitted = false
let highlightTimer = null
let handleGroup = null
let handleInfo = null
let handleDrag = null
let pointerStart = null
const activePointers = new Set()

const vacantGroup = new THREE.Group()
let gridHelper = new THREE.GridHelper(160, 16, 0x3b495e, 0x1d2633)
gridHelper.rotation.x = Math.PI / 2
vacantGroup.add(gridHelper)
vacantGroup.add(new THREE.AxesHelper(45))
vacantGroup.visible = false
scene.add(vacantGroup)

const rebuildGrid = (isDark) => {
  vacantGroup.remove(gridHelper)
  gridHelper.geometry?.dispose?.()
  gridHelper.material?.dispose?.()
  gridHelper = new THREE.GridHelper(
    160,
    16,
    isDark ? 0x3b495e : 0x9aa8bc,
    isDark ? 0x1d2633 : 0xdbe2ec,
  )
  gridHelper.rotation.x = Math.PI / 2
  vacantGroup.add(gridHelper)
}

const bytes = new Map()
const CACHE_LIMIT = 6

const remember = (store, key, value) => {
  if (store.has(key)) store.delete(key)
  store.set(key, value)
  while (store.size > CACHE_LIMIT) {
    const oldest = store.keys().next().value
    store.delete(oldest)
  }
}

const fit = (object) => {
  const box = new THREE.Box3().setFromObject(object)
  if (box.isEmpty()) return
  const sphere = box.getBoundingSphere(new THREE.Sphere())
  const radius = Math.max(sphere.radius, 1)
  // The hub covers the lower part of the canvas, so frame the part slightly
  // above the geometric centre and leave margin around it.
  const lift = new THREE.Vector3(0, 0, -radius * 0.24)
  const direction = camera.position.clone().sub(controls.target)
  if (direction.lengthSq() < 1e-9) direction.set(1, -1, 0.78)
  direction.normalize()
  controls.target.copy(sphere.center).add(lift)
  camera.position.copy(controls.target).addScaledVector(direction, radius * 3.1)
  camera.near = Math.max(radius / 3000, 0.01)
  camera.far = Math.max(radius * 300, 200)
  camera.updateProjectionMatrix()
  controls.update()
}

const setView = (name) => {
  if (!display || !VIEWS[name]) return
  const sphere = new THREE.Box3().setFromObject(display).getBoundingSphere(new THREE.Sphere())
  const direction = new THREE.Vector3(...VIEWS[name]).normalize()
  controls.target.copy(sphere.center)
  camera.position.copy(sphere.center)
    .addScaledVector(direction, Math.max(sphere.radius, 1) * 2.55)
  camera.updateProjectionMatrix()
  controls.update()
}

const disposeObject = (object) => {
  if (!object) return
  scene.remove(object)
  object.traverse((child) => {
    if (child.userData?.edges) {
      child.remove(child.userData.edges)
      child.userData.edges.geometry?.dispose?.()
      child.userData.edges.material?.dispose?.()
    }
    child.geometry?.dispose?.()
    const material = child.material
    if (Array.isArray(material)) material.forEach((item) => item.dispose?.())
    else material?.dispose?.()
  })
}

const dressSolid = (object) => {
  object.traverse((child) => {
    if (!child.isMesh) return
    child.material = new THREE.MeshStandardMaterial({
      color: palette.solid.clone(), metalness: 0.1, roughness: 0.62,
    })
    child.userData.solidMaterial = child.material
  })
  return object
}

// The loader also attaches its own helper lines, whose materials belong to the
// kernel's copy of the renderer. Drop them so every drawn object is ours.
const stripHelpers = (object) => {
  const drop = []
  object.traverse((child) => {
    if (child === object) return
    if (child.isMesh) return
    if (child.isLine || child.isLineSegments || child.isPoints) drop.push(child)
  })
  for (const child of drop) {
    child.parent?.remove(child)
    child.geometry?.dispose?.()
    const material = child.material
    if (Array.isArray(material)) material.forEach((item) => item.dispose?.())
    else material?.dispose?.()
  }
  return object
}

const parseBytes = (payload) => {
  const object = stripHelpers(new kernel.STEPLoader().parse(payload))
  dressSolid(object)
  return object
}

const fetchBytes = async (documentId, version) => {
  const key = `${documentId}:${version}`
  if (bytes.has(key)) return bytes.get(key)
  const response = await fetch(`/api/docs/${documentId}/step?version=${version}`)
  if (!response.ok) throw new Error(`STEP ${response.status}`)
  const payload = new Uint8Array(await response.arrayBuffer())
  remember(bytes, key, payload)
  return payload
}

const objectFor = async (documentId, version) => {
  // Parsing yields objects owned by the kernel loader; each consumer gets a
  // freshly parsed copy so its materials never come from a foreign renderer.
  return parseBytes(await fetchBytes(documentId, version))
}

const showSimplified = async (documentId, version, options = {}) => {
  const requestId = Number(options.requestId) || 0
  if (requestId) latestDesignRequest = Math.max(latestDesignRequest, requestId)
  const requestToken = latestDesignRequest
  const parseStart = performance.now()
  try {
    const response = await fetch(`/api/docs/${documentId}/export/stl?version=${version}`)
    if (!response.ok) throw new Error(`STL ${response.status}`)
    const geometry = new STLLoader().parse(await response.arrayBuffer())
    if (requestToken !== latestDesignRequest) {
      geometry.dispose()
      return
    }
    const material = new THREE.MeshStandardMaterial({ color: palette.solid.clone(), metalness: 0.1, roughness: 0.62 })
    const object = new THREE.Mesh(geometry, material)
    object.userData.simplified = true
    display = object
    scene.add(display)
    clearHandle()
    previewActive = false
    currentVersion = version
    if (!hasFitted || options.fit) { fit(display); hasFitted = true }
    applySection()
    say(`v${version} · 简化显示`)
    post('shown', {
      version,
      documentId,
      faces: 1,
      simplified: true,
      timings: { parseMs: performance.now() - parseStart, edgesMs: 0, totalMs: performance.now() - parseStart },
    })
  } catch (error) {
    say(`简化模型加载失败 ${error.message}`)
  }
}

const sectionPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)

const applySection = () => {
  if (!display) return
  renderer.localClippingEnabled = true
  const axis = new THREE.Vector3(
    sectionAxis === 'X' ? -1 : 0, sectionAxis === 'Y' ? -1 : 0, sectionAxis === 'Z' ? -1 : 0,
  )
  sectionPlane.normal.copy(axis)
  if (sectionOn) {
    const box = new THREE.Box3().setFromObject(display)
    const low = sectionAxis === 'X' ? box.min.x : sectionAxis === 'Y' ? box.min.y : box.min.z
    const high = sectionAxis === 'X' ? box.max.x : sectionAxis === 'Y' ? box.max.y : box.max.z
    sectionPlane.constant = low + (high - low) * sectionT
  }
  const planes = sectionOn ? [sectionPlane] : null
  const paint = (root) => {
    if (!root) return
    root.traverse((child) => {
      if (!child.material) return
      const isMesh = child.isMesh
      if (!isMesh && !child.isLineSegments && !child.isLine) return
      child.material.clippingPlanes = planes
      if (isMesh) child.material.side = sectionOn ? THREE.DoubleSide : THREE.FrontSide
      child.material.needsUpdate = true
      if (isMesh && child.userData.edges) {
        child.userData.edges.material.clippingPlanes = planes
        child.userData.edges.material.needsUpdate = true
      }
    })
  }
  paint(display)
  paint(ghost)
}

const applyWire = () => {
  if (!display || display.userData?.simplified) return
  display.traverse((child) => {
    if (!child.isMesh) return
    if (child.userData.edges) {
      child.remove(child.userData.edges)
      child.userData.edges.geometry.dispose()
      child.userData.edges.material.dispose()
      child.userData.edges = null
    }
    if (wire) {
      child.material = new THREE.MeshBasicMaterial({
        color: palette.edge.clone(), transparent: true, opacity: 0.12, depthWrite: false,
      })
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(child.geometry, 16),
        new THREE.LineBasicMaterial({ color: palette.edge.clone() }),
      )
      child.userData.edges = edges
      child.add(edges)
    } else {
      child.material = child.userData.solidMaterial || child.material
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(child.geometry, 16),
        new THREE.LineBasicMaterial({
          color: palette.edge.clone(), transparent: true, opacity: 0.5, depthWrite: false,
        }),
      )
      child.userData.edges = edges
      child.add(edges)
    }
  })
  applySection()
}

const clearHighlight = () => {
  if (highlightTimer) { clearTimeout(highlightTimer); highlightTimer = null }
  if (highlightGroup) {
    disposeObject(highlightGroup)
    highlightGroup = null
  }
}

const highlightFaces = (centers, seconds = 3.2, tone = 'change') => {
  if (!display || !centers?.length) return
  clearHighlight()
  const anchors = centers.map((item) => new THREE.Vector3(item[0], item[1], item[2]))
  const group = new THREE.Group()
  const selection = tone === 'selection'
  const mat = new THREE.MeshStandardMaterial({
    color: selection ? 0x4f8cff : 0xffb454,
    emissive: selection ? 0x123a6b : 0x663800,
    roughness: 0.45,
    metalness: 0.05,
    transparent: true,
    opacity: selection ? 0.46 : 0.62,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2,
    depthWrite: false,
    side: THREE.DoubleSide,
  })
  display.updateMatrixWorld(true)
  let matched = 0
  display.traverse((child) => {
    if (!child.isMesh || typeof child.faces !== 'function') return
    for (const face of child.faces()) {
      const center = face.getCenter()
      center.applyMatrix4(child.matrixWorld)
      let hit = false
      for (const anchor of anchors) {
        if (center.distanceTo(anchor) <= 0.6) { hit = true; break }
      }
      if (!hit) continue
      const overlay = new THREE.Mesh(face.geometry, mat)
      overlay.applyMatrix4(child.matrixWorld)
      group.add(overlay)
      matched += 1
    }
  })
  if (!matched) {
    mat.dispose()
    return
  }
  highlightGroup = group
  scene.add(highlightGroup)
  if (seconds > 0) highlightTimer = setTimeout(clearHighlight, seconds * 1000)
}

const clearGhost = () => {
  if (!ghost) return
  disposeObject(ghost)
  ghost = null
}

const showGhost = async (documentId, version) => {
  clearGhost()
  try {
    const parseStart = performance.now()
    const object = await objectFor(documentId, version)
    const parseMs = performance.now() - parseStart
    object.traverse((child) => {
      if (!child.isMesh) return
      child.material = new THREE.MeshBasicMaterial({
        color: palette.ghost.clone(), transparent: true, opacity: palette.ghostOpacity, depthWrite: false,
      })
      child.add(new THREE.LineSegments(
        new THREE.EdgesGeometry(child.geometry, 16),
        new THREE.LineBasicMaterial({ color: palette.ghostEdge.clone(), transparent: true, opacity: 0.32 }),
      ))
    })
    ghost = object
    scene.add(ghost)
    applySection()
    say(`残影 v${version} 叠加中`)
  } catch (error) {
    say(`残影加载失败 ${error.message}`)
  }
}

let latestDesignRequest = 0

const showVersion = async (documentId, version, options = {}) => {
  currentDoc = documentId
  if (!kernel) return
  const requestId = Number(options.requestId) || 0
  if (requestId) latestDesignRequest = Math.max(latestDesignRequest, requestId)
  const requestToken = latestDesignRequest
  if (!documentId || !version) {
    previewActive = false
    clearHighlight()
    disposeObject(display)
    display = null
    clearGhost()
    vacantGroup.visible = true
    controls.target.set(0, 0, 0)
    camera.position.set(110, -110, 82)
    camera.updateProjectionMatrix()
    controls.update()
    empty.classList.add('on')
    currentVersion = version || 0
    say('空白文档')
    return
  }
  vacantGroup.visible = false
  empty.classList.remove('on')
  if (!previewActive && currentVersion === version && display && !options.force) return
  previewActive = false
  clearHighlight()
  if (options.simplified) {
    disposeObject(display)
    display = null
    await showSimplified(documentId, version, options)
    return
  }
  const keep = display
  try {
    const parseStart = performance.now()
    const object = await objectFor(documentId, version)
    const parseMs = performance.now() - parseStart
    if (requestToken !== latestDesignRequest) {
      disposeObject(object)
      return
    }
    display = object
    scene.add(display)
    disposeObject(keep)
    clearHandle()
    currentVersion = version
    if (!hasFitted || options.fit) { fit(display); hasFitted = true }
    const edgesStart = performance.now()
    applyWire()
    applySection()
    const edgesMs = performance.now() - edgesStart
    if (options.highlight?.length) highlightFaces(options.highlight)
    const meshes = countFaces(display)
    say(`v${version} · ${meshes} 个面组`)
    post('shown', { version, documentId, faces: meshes, timings: { parseMs, edgesMs, totalMs: performance.now() - parseStart } })
  } catch (error) {
    display = keep
    say(`模型加载失败 ${error.message}`)
  }
}

const showPreview = async (url, label) => {
  if (!kernel || !url) return
  vacantGroup.visible = false
  empty.classList.remove('on')
  clearHighlight()
  const keep = display
  try {
    const response = await fetch(url)
    if (!response.ok) throw new Error(`STEP ${response.status}`)
    const object = parseBytes(new Uint8Array(await response.arrayBuffer()))
    previewActive = true
    display = object
    scene.add(display)
    disposeObject(keep)
    clearHandle()
    if (!hasFitted) { fit(display); hasFitted = true }
    applyWire()
    applySection()
    say(`预览 · ${label || '候选方案'}`)
  } catch (error) {
    display = keep
    say(`预览失败 ${error.message}`)
  }
}

const countFaces = (object) => {
  const set = new Set()
  object.traverse((child) => { if (child.isMesh) set.add(child.uuid) })
  return set.size
}

const prefetch = (documentId, version) => {
  if (!documentId || !version) return
  fetchBytes(documentId, version).catch(() => {})
}

const raycaster = new THREE.Raycaster()
const pickAt = (event) => {
  if (!display) return null
  const rect = renderer.domElement.getBoundingClientRect()
  raycaster.setFromCamera(new THREE.Vector2(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1,
  ), camera)
  const hits = raycaster.intersectObject(display, true)
    .filter((hit) => !sectionOn || sectionPlane.distanceToPoint(hit.point) >= -1e-6)
  if (!hits.length) return null
  const hit = hits[0]
  const brep = hit.brep || hit.object.userData?.brep || hit.object.userData?.face
  let normal = null
  if (hit.face?.normal) {
    normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld)
  }
  return {
    point: [hit.point.x, hit.point.y, hit.point.z],
    normal: normal ? [normal.x, normal.y, normal.z] : null,
    area: brep?.area ?? null,
    face_index: hit.faceIndex ?? null,
  }
}

const pickupIsClick = (event, start) => {
  if (!start || event.pointerId !== start.id || event.button !== 0) return false
  const moved = Math.hypot(event.clientX - start.x, event.clientY - start.y)
  return moved <= 4 && performance.now() - start.t <= 600
}

const HANDLE_COLOR = 0x5aa7ff
const clearHandle = () => {
  if (handleGroup) {
    scene.remove(handleGroup)
    disposeObject(handleGroup)
    handleGroup = null
  }
  handleInfo = null
  if (handleDrag) {
    handleDrag = null
    controls.enabled = true
  }
}

const projectScreen = (vector) => {
  const projected = vector.clone().project(camera)
  const rect = renderer.domElement.getBoundingClientRect()
  return {
    x: rect.left + (projected.x + 1) * 0.5 * rect.width,
    y: rect.top + (1 - projected.y) * 0.5 * rect.height,
  }
}

const handleValueText = (value) => {
  const unit = handleInfo?.unit ? ` ${handleInfo.unit}` : ''
  return `${handleInfo?.label || handleInfo?.param || '尺寸'}：${value}${unit}`
}

const clampHandleValue = (value) => {
  let next = Number(value)
  if (!Number.isFinite(next)) return null
  if (handleInfo?.integer) next = Math.round(next)
  else next = Math.round(next * 1000) / 1000
  if (handleInfo?.minimum != null) next = Math.max(handleInfo.minimum, next)
  if (handleInfo?.maximum != null) next = Math.min(handleInfo.maximum, next)
  return next
}

const setHandle = (payload) => {
  clearHandle()
  if (!payload?.point || !payload?.axis) return
  const point = new THREE.Vector3(...payload.point)
  const axis = new THREE.Vector3(...payload.axis)
  if (axis.lengthSq() < 1e-12) axis.set(0, 0, 1)
  axis.normalize()
  const distance = camera.position.distanceTo(point)
  const worldPerPixel = 2 * distance
    * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))
    / Math.max(renderer.domElement.clientHeight, 1)
  const length = Math.max(worldPerPixel * 90, 0.01)
  const end = point.clone().addScaledVector(axis, length)
  const group = new THREE.Group()
  const material = new THREE.LineBasicMaterial({
    color: HANDLE_COLOR, depthTest: false, transparent: true, opacity: 0.95,
  })
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([point, end]), material)
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(length * 0.07, length * 0.18, 12),
    new THREE.MeshBasicMaterial({ color: HANDLE_COLOR, depthTest: false, transparent: true }),
  )
  cone.position.copy(end.clone().addScaledVector(axis, -length * 0.09))
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), axis)
  const knob = new THREE.Mesh(
    new THREE.SphereGeometry(length * 0.085, 12, 8),
    new THREE.MeshBasicMaterial({ color: HANDLE_COLOR, depthTest: false, transparent: true }),
  )
  knob.position.copy(point)
  group.add(line, cone, knob)
  group.traverse((child) => { child.renderOrder = 30; child.frustumCulled = false })
  scene.add(group)
  handleGroup = group
  handleInfo = { ...payload, point, axis, length, worldPerPixel }
  say(`拖动 ${handleValueText(handleInfo.value)}`)
}

const handleHit = (event) => {
  if (!handleInfo) return false
  const start = projectScreen(handleInfo.point)
  const end = projectScreen(handleInfo.point.clone().addScaledVector(handleInfo.axis, handleInfo.length))
  const dx = end.x - start.x
  const dy = end.y - start.y
  const length2 = dx * dx + dy * dy
  const t = length2 > 0
    ? Math.min(1, Math.max(0, ((event.clientX - start.x) * dx + (event.clientY - start.y) * dy) / length2))
    : 0
  const px = start.x + dx * t
  const py = start.y + dy * t
  return Math.hypot(event.clientX - px, event.clientY - py) <= 14
}

const beginHandleDrag = (event) => {
  if (event.button !== 0 || !handleHit(event)) return false
  const start = projectScreen(handleInfo.point)
  const end = projectScreen(handleInfo.point.clone().addScaledVector(handleInfo.axis, handleInfo.length))
  handleDrag = {
    id: event.pointerId,
    startX: event.clientX,
    startY: event.clientY,
    dirX: end.x - start.x,
    dirY: end.y - start.y,
    startValue: Number(handleInfo.value),
    value: clampHandleValue(handleInfo.value),
  }
  controls.enabled = false
  try { renderer.domElement.setPointerCapture(event.pointerId) } catch (error) { /* pointer capture is optional */ }
  say(`拖动 ${handleValueText(handleDrag.value)}`)
  return true
}

const moveHandleDrag = (event) => {
  if (!handleDrag || event.pointerId !== handleDrag.id) return
  const dx = event.clientX - handleDrag.startX
  const dy = event.clientY - handleDrag.startY
  const pixels = Math.hypot(handleDrag.dirX, handleDrag.dirY) > 0
    ? (dx * handleDrag.dirX + dy * handleDrag.dirY) / Math.hypot(handleDrag.dirX, handleDrag.dirY)
    : 0
  const next = clampHandleValue(handleDrag.startValue + pixels * handleInfo.worldPerPixel)
  if (next == null || next === handleDrag.value) return
  handleDrag.value = next
  say(`拖动 ${handleValueText(next)}`)
  post('handleMove', { value: next, param: handleInfo.param, feature_id: handleInfo.feature_id })
}

const finishHandleDrag = (event, cancel = false) => {
  if (!handleDrag) return
  const value = handleDrag.value
  const info = handleInfo
  try { renderer.domElement.releasePointerCapture(handleDrag.id) } catch (error) { /* already released */ }
  handleDrag = null
  controls.enabled = true
  if (cancel) {
    post('handleCancel', { param: info?.param, feature_id: info?.feature_id })
    say('已取消拖动')
  } else if (info && value === Number(info.value)) {
    post('handleCancel', { param: info?.param, feature_id: info?.feature_id })
    say('尺寸未改变')
  } else {
    post('handleCommit', { value, param: info?.param, feature_id: info?.feature_id })
    say(`应用 ${handleValueText(value)}`)
  }
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  if (!beginHandleDrag(event)) return
  event.preventDefault()
  event.stopImmediatePropagation()
}, true)
addEventListener('pointermove', (event) => {
  if (!handleDrag) return
  event.preventDefault()
  moveHandleDrag(event)
}, true)
addEventListener('pointerup', (event) => {
  if (!handleDrag) return
  event.preventDefault()
  event.stopImmediatePropagation()
  finishHandleDrag(event)
}, true)
addEventListener('pointercancel', (event) => {
  if (!handleDrag) return
  finishHandleDrag(event, true)
}, true)

renderer.domElement.addEventListener('pointerdown', (event) => {
  activePointers.add(event.pointerId)
  pointerStart = event.button === 0 && activePointers.size === 1
    ? { id: event.pointerId, x: event.clientX, y: event.clientY, t: performance.now() }
    : null
})
renderer.domElement.addEventListener('pointercancel', (event) => {
  activePointers.delete(event.pointerId)
  pointerStart = null
})
renderer.domElement.addEventListener('pointerup', (event) => {
  const start = pointerStart
  activePointers.delete(event.pointerId)
  pointerStart = null
  // OrbitControls turns left-drag into rotation and right-drag into pan; only a
  // short left press is a selection, otherwise every orbit would pick a face.
  if (!display || !pickupIsClick(event, start)) return
  const found = pickAt(event)
  if (!found) {
    post('pick', { pick: null })
    say('未选中几何')
    return
  }
  if (measureMode) {
    if (!measureA) {
      measureA = { point: new THREE.Vector3(...found.point), normal: found.normal }
      say(`起点 (${found.point.map((n) => n.toFixed(1)).join(', ')}) · 再点一处量距离`)
      return
    }
    const end = new THREE.Vector3(...found.point)
    const delta = end.clone().sub(measureA.point)
    let text = `距离 ${delta.length().toFixed(2)} mm · Δx ${delta.x.toFixed(2)} `
      + `Δy ${delta.y.toFixed(2)} Δz ${delta.z.toFixed(2)}`
    let angle = null
    if (measureA.normal && found.normal) {
      const a = new THREE.Vector3(...measureA.normal).normalize()
      const b = new THREE.Vector3(...found.normal).normalize()
      angle = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1)))
      text += ` · 夹角 ${angle.toFixed(1)}°`
    }
    say(text)
    post('measure', {
      result: {
        distance: delta.length(),
        dx: delta.x,
        dy: delta.y,
        dz: delta.z,
        angle,
        a: [measureA.point.x, measureA.point.y, measureA.point.z],
        b: found.point,
      },
    })
    measureA = null
    return
  }
  post('pick', { pick: { ...found, scope: pickScope, documentId: currentDoc, version: currentVersion } })
  say(`拾取 (${found.point.map((n) => n.toFixed(1)).join(', ')})`
    + (found.area != null ? ` · ${Number(found.area).toFixed(1)} mm²` : ''))
})

const viewKeys = { 1: 'iso', 2: 'front', 3: 'top', 4: 'right' }
addEventListener('keydown', (event) => {
  const tag = event.target?.tagName
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || event.target?.isContentEditable) return
  if (event.key === 'Escape' && handleDrag) {
    event.preventDefault()
    finishHandleDrag(event, true)
    return
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return
  const name = viewKeys[event.key]
  if (name) {
    event.preventDefault()
    setView(name)
    return
  }
  const key = event.key.toLowerCase()
  if (key === 'f') {
    event.preventDefault()
    if (display) fit(display)
    return
  }
  if (event.key === 'Escape') {
    post('pick', { pick: null })
    clearHighlight()
  }
})

addEventListener('message', (event) => {
  const data = event.data
  if (!data || data.from !== 'brepx-workbench') return
  if (data.type === 'clear') {
    currentDoc = null
    currentVersion = 0
    previewActive = false
    clearHighlight()
    disposeObject(display)
    display = null
    clearGhost()
    vacantGroup.visible = true
    empty.classList.add('on')
    hasFitted = false
    controls.target.set(0, 0, 0)
    camera.position.set(110, -110, 82)
    camera.updateProjectionMatrix()
    controls.update()
    say('空白文档')
    post('cleared', {})
  } else if (data.type === 'design') {
    showVersion(data.documentId, data.version, { fit: data.fit, highlight: data.highlight, simplified: data.simplified })
    if (data.prefetch) prefetch(data.documentId, data.prefetch)
  } else if (data.type === 'preview') {
    showPreview(data.url, data.label)
  } else if (data.type === 'ghost') {
    if (data.on === false || !data.version) { clearGhost(); say('残影关闭') }
    else showGhost(data.documentId || currentDoc, data.version)
  } else if (data.type === 'highlight') {
    if (data.centers?.length) highlightFaces(data.centers, data.seconds ?? 3.2, data.tone)
    else clearHighlight()
  } else if (data.type === 'view') {
    setView(data.name)
  } else if (data.type === 'fit') {
    if (display) fit(display)
  } else if (data.type === 'scope') {
    pickScope = ['body', 'face', 'edge', 'point'].includes(data.scope) ? data.scope : 'face'
    say(`选择范围：${{ body: '实体', face: '面', edge: '边', point: '点' }[pickScope]}`)
  } else if (data.type === 'handle') {
    setHandle(data.axis ? data : null)
  } else if (data.type === 'wire') {
    wire = typeof data.on === 'boolean' ? data.on : !wire
    applyWire()
  } else if (data.type === 'measure') {
    measureMode = typeof data.on === 'boolean' ? data.on : !measureMode
    measureA = null
    say(measureMode ? '测量已开启：点两处取距离与夹角' : '测量已关闭')
  } else if (data.type === 'section') {
    if (typeof data.on === 'boolean') sectionOn = data.on
    if (data.axis) sectionAxis = data.axis
    if (typeof data.t === 'number') sectionT = Math.min(Math.max(data.t, 0), 1)
    applySection()
  } else if (data.type === 'resize') {
    resize()
  } else if (data.type === 'theme') {
    applyPalette(data)
  }
})

const resize = () => {
  const width = host.clientWidth || 1
  const height = host.clientHeight || 1
  renderer.setSize(width, height, false)
  camera.aspect = width / height
  camera.updateProjectionMatrix()
}
addEventListener('resize', resize)
const resizeObserver = new ResizeObserver(resize)
resizeObserver.observe(host)

let frameCount = 0
let lastFrameError = null
const frame = () => {
  requestAnimationFrame(frame)
  try {
    controls.update()
    renderer.render(scene, camera)
    frameCount += 1
  } catch (error) {
    lastFrameError = error.message
  }
}

const start = async () => {
  resize()
  frame()
  try {
    const payload = await (await fetch('/api/kernel/smlibwasm.wasm')).arrayBuffer()
    say(`kernel ${(payload.byteLength / 1e6).toFixed(1)} MB · loading…`)
    kernel = await init({ wasmBinary: payload })
    window.__kernelReady = true
    say('kernel ready')
    post('ready', {})
  } catch (error) {
    say(`kernel failed: ${error.message}`)
    post('error', { text: error.message })
  }
}

start()
</script>
</body>
</html>
