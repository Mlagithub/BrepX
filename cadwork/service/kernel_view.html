  const qz = sx * e1y - sy * e1x
  const v = (direction.x * qx + direction.y * qy + direction.z * qz) * inverse
  if (v < 0 || u + v > 1) return null
  const t = (e2x * qx + e2y * qy + e2z * qz) * inverse
  if (t <= 0) return null
  return {
    t,
    point: new THREE.Vector3(
      origin.x + direction.x * t,
      origin.y + direction.y * t,
      origin.z + direction.z * t,
    ),
    normal: new THREE.Vector3(e1y * e2z - e1z * e2y, e1z * e2x - e1x * e2z, e1x * e2y - e1y * e2x).normalize(),
  }
}

const pickAssemblyPreviewAt = (clientX, clientY) => {
  if (!assemblyPreviewPicking || !assemblyPreviewGroup) return null
  const rect = renderer.domElement.getBoundingClientRect()
  if (!rect.width || !rect.height) return null
  const picker = new THREE.Raycaster()
  picker.setFromCamera(new THREE.Vector2(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1,
  ), camera)
  const worldRay = picker.ray
  const localOrigin = new THREE.Vector3()
  const localDirection = new THREE.Vector3()
  const worldPoint = new THREE.Vector3()
  const worldNormal = new THREE.Vector3()
  const normalMatrix = new THREE.Matrix3()
  let best = null
  for (const instance of assemblyPreviewPicking.instances) {
    if (instance.visible === false) continue
    const bvh = assemblyPreviewPicking.prototypes.get(instance.prototypeKey)
    if (!bvh || !bvh.triangleCount) continue
    localOrigin.copy(worldRay.origin).applyMatrix4(instance.inverse)
    localDirection.copy(worldRay.direction).transformDirection(instance.inverse)
    const stack = bvh.nodes.length ? [0] : []
    let localBest = null
    while (stack.length) {
      const node = bvh.nodes[stack.pop()]
      if (!assemblyPreviewRayAabb(localOrigin, localDirection, node.min, node.max)) continue
      if (node.left === -1) {
        for (let entry = node.start; entry < node.end; entry += 1) {
          const triangle = bvh.order[entry]
          const hit = assemblyPreviewTriangleHit(localOrigin, localDirection, bvh.positions, bvh.indices, triangle)
          if (hit && (!localBest || hit.t < localBest.t)) localBest = { hit, triangle }
        }
      } else {
        stack.push(node.left, node.right)
      }
    }
    if (!localBest) continue
    worldPoint.copy(localBest.hit.point).applyMatrix4(instance.matrix)
    const distance = worldPoint.distanceTo(worldRay.origin)
    if (best && distance >= best.distance) continue
    normalMatrix.getNormalMatrix(instance.matrix)
    worldNormal.copy(localBest.hit.normal).applyMatrix3(normalMatrix).normalize()
    const faceId = bvh.faceIds[localBest.triangle]
    best = {
      scope: 'assembly',
      assemblyId: assemblyPreviewPicking.assemblyId,
      version: assemblyPreviewPicking.version,
      instancePath: instance.path,
      instanceId: instance.instanceId,
      prototypeKey: instance.prototypeKey,
      faceKey: bvh.faceKeys?.[faceId] ?? null,
      faceIndex: faceId,
      triangle: localBest.triangle,
      distance,
      point: [worldPoint.x, worldPoint.y, worldPoint.z],
      normal: [worldNormal.x, worldNormal.y, worldNormal.z],
      localPoint: [localBest.hit.point.x, localBest.hit.point.y, localBest.hit.point.z],
    }
  }
  return best
}

window.__assemblyPreviewPickAt = pickAssemblyPreviewAt
window.__assemblyPreviewProject = (point) => {
  if (!point || point.length < 3) return null
  const projected = new THREE.Vector3(point[0], point[1], point[2]).project(camera)
  const rect = renderer.domElement.getBoundingClientRect()
  return {
    x: rect.left + (projected.x + 1) * 0.5 * rect.width,
    y: rect.top + (1 - projected.y) * 0.5 * rect.height,
    z: projected.z,
  }
}
window.__assemblyPreviewPickingInfo = () => assemblyPreviewPicking ? {
  assemblyId: assemblyPreviewPicking.assemblyId,
  version: assemblyPreviewPicking.version,
  instances: assemblyPreviewPicking.instances.length,
  prototypes: [...assemblyPreviewPicking.prototypes.values()].map((bvh) => ({
    prototypeKey: bvh.prototypeKey,
    triangles: bvh.triangleCount,
    nodes: bvh.nodes.length,
  })),
} : null

const disposeAssemblyPreviewRender = () => {
  if (assemblyPreviewGroup) {
    scene.remove(assemblyPreviewGroup)
    assemblyPreviewGroup.traverse((child) => {
      if (child.isInstancedMesh) {
        child.dispose?.()
      }
    })
  }
  for (const geometry of assemblyPreviewGeometries) geometry.dispose?.()
  for (const geometry of assemblyPreviewEdgeGeometries) geometry.dispose?.()
  for (const material of assemblyPreviewMaterials.values()) material.dispose?.()
  assemblyPreviewEdgeMaterial?.dispose?.()
  assemblyPreviewEdgeMaterial = null
  assemblyPreviewGeometries = new Set()
  assemblyPreviewEdgeGeometries = new Set()
  assemblyPreviewMaterials = new Map()
  assemblyPreviewEdgeMeshes = []
  assemblyPreviewSelection = new Set()
  assemblyPreviewGroup = null
  assemblyPreviewEdgeGroup = null
  assemblyPreviewRenderInfo = null
  assemblyPreviewPicking = null
  window.__assemblyPreviewSelectedPaths = []
  window.__assemblyPreviewGroup = null
  window.__assemblyPreviewRender = null
  window.__assemblyPreviewEdgeGroup = null
}

const assemblyPreviewPrototypeGeometry = (prototype, arrays) => {
  const mesh = prototype.mesh
  if (!mesh.positionCount || !mesh.indexCount) return null
  const geometry = new THREE.BufferGeometry()
  geometry.setAttribute('position', new THREE.BufferAttribute(arrays.positions, 3))
  geometry.setIndex(new THREE.BufferAttribute(arrays.indices, 1))
  // The wire format has no normals; one interpolation normal set per prototype
  // is enough because every instance shares the same local mesh.
  geometry.computeVertexNormals()
  if (Array.isArray(prototype.bounds) && prototype.bounds.length === 2) {
    const low = prototype.bounds[0]
    const high = prototype.bounds[1]
    geometry.boundingBox = new THREE.Box3(
      new THREE.Vector3(low[0], low[1], low[2]),
      new THREE.Vector3(high[0], high[1], high[2]),
    )
    geometry.boundingSphere = geometry.boundingBox.getBoundingSphere(new THREE.Sphere())
  } else {
    geometry.computeBoundingBox()
    geometry.computeBoundingSphere()
  }
  geometry.userData.prototypeKey = prototype.prototypeKey
  geometry.userData.prototypeBounds = prototype.bounds
  geometry.userData.faceKeys = prototype.faceKeys
  geometry.userData.faceIds = arrays.faceIds
  geometry.userData.edgePoints = arrays.edges
  assemblyPreviewGeometries.add(geometry)
  return geometry
}

/*
 * The decoded manifest is display data: one local geometry per prototype, then
 * one InstancedMesh per (prototype, material, opacity, visible) group. Instance
 * colour never splits a batch; it is carried by the per-instance colour
 * attribute. Transparent batches are separated from opaque ones so they can
 * keep depthWrite off, and suppressed or invisible rows never become draws.
 */
const renderAssemblyPreview = (decoded) => {
  if (!decoded) return null
  disposeAssemblyPreviewRender()
  const manifest = decoded.manifest
  const arraysByKey = new Map(decoded.prototypes.map((prototype) => [prototype.prototypeKey, prototype]))
  const geometries = new Map()
  for (const prototype of manifest.prototypes) {
    const arrays = arraysByKey.get(prototype.prototypeKey)
    if (!arrays) continue
    const geometry = assemblyPreviewPrototypeGeometry(prototype, arrays)
    if (geometry) geometries.set(prototype.prototypeKey, geometry)
  }
  const rootOffset = Array.isArray(manifest.rootOffset) ? manifest.rootOffset : [0, 0, 0]
  const edgePositions = new Map()
  for (const prototype of manifest.prototypes) {
    const arrays = arraysByKey.get(prototype.prototypeKey)
    if (arrays?.edges?.length) {
      edgePositions.set(prototype.prototypeKey, new THREE.BufferAttribute(arrays.edges, 3))
    }
  }
  const groups = new Map()
  const moduleColors = new Map()
  for (const instance of manifest.instances) {
    const module = instance.module || ''
    if (!moduleColors.has(module)) {
      const value = ASSEMBLY_PREVIEW_XRAY_PALETTE[
        moduleColors.size % ASSEMBLY_PREVIEW_XRAY_PALETTE.length
      ]
      moduleColors.set(module, new THREE.Color(value))
    }
  }
  for (const instance of manifest.instances) {
    if (!geometries.has(instance.prototypeKey)) continue
    const opacity = Math.min(Math.max(Number(instance.opacity ?? 1), 0), 1)
    const visible = instance.visible !== false && !instance.suppressed
    const materialKey = `standard:${opacity}`
    const groupKey = `${instance.prototypeKey}|${materialKey}|${visible ? 1 : 0}`
    let group = groups.get(groupKey)
    if (!group) {
      group = {
        key: groupKey,
        prototypeKey: instance.prototypeKey,
        materialKey,
        opacity,
        transparent: opacity < 1,
        visible,
        instances: [],
      }
      groups.set(groupKey, group)
    }
    group.instances.push(instance)
  }
  const root = new THREE.Group()
  root.name = 'assembly-preview'
  root.userData.previewKey = manifest.previewKey
  root.userData.prototypeCount = geometries.size
  root.userData.instanceCount = manifest.instanceCount
  const matrix = new THREE.Matrix4()
  const color = new THREE.Color()
  const batches = []
  const edgeRoot = new THREE.Group()
  edgeRoot.name = 'assembly-preview-edges'
  edgeRoot.visible = showEdges
  const edgeMaterial = assemblyPreviewEdgeShaderMaterial()
  const edgeBatches = []
  const edgeMeshes = []
  for (const group of groups.values()) {
    const geometry = geometries.get(group.prototypeKey)
    if (!geometry || !group.instances.length) continue
    const material = assemblyPreviewMaterial(group.opacity)
    const mesh = new THREE.InstancedMesh(geometry, material, group.instances.length)
    mesh.name = `assembly-preview:${group.prototypeKey.slice(0, 8)}:${group.materialKey}:${group.visible ? 'visible' : 'hidden'}`
    mesh.frustumCulled = true
    mesh.renderOrder = group.transparent ? 1 : 0
    mesh.userData.prototypeKey = group.prototypeKey
    mesh.userData.opacity = group.opacity
    mesh.userData.visible = group.visible
    mesh.userData.transparent = group.transparent
    mesh.userData.instancePaths = group.instances.map((instance) => instance.path)
    for (let index = 0; index < group.instances.length; index += 1) {
      const instance = group.instances[index]
      matrix.fromArray(instance.matrix)
      // rootOffset is an origin-rebasing offset added to every placed instance;
      // it is not part of the prototype geometry.
      matrix.elements[12] += Number(rootOffset[0]) || 0
      matrix.elements[13] += Number(rootOffset[1]) || 0
      matrix.elements[14] += Number(rootOffset[2]) || 0
      mesh.setMatrixAt(index, matrix)
      color.setStyle(instance.color || ASSEMBLY_PREVIEW_DEFAULT_COLOR)
      mesh.setColorAt(index, color)
    }
    mesh.instanceMatrix.needsUpdate = true
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true
    mesh.userData.baseColors = mesh.instanceColor
      ? new Float32Array(mesh.instanceColor.array)
      : null
    const xrayColors = new Float32Array(mesh.count * 3)
    for (let index = 0; index < group.instances.length; index += 1) {
      const tint = moduleColors.get(group.instances[index].module || '')
        || new THREE.Color(ASSEMBLY_PREVIEW_DEFAULT_COLOR)
      xrayColors[index * 3] = tint.r
      xrayColors[index * 3 + 1] = tint.g
      xrayColors[index * 3 + 2] = tint.b
    }
    mesh.userData.xrayColors = xrayColors
    mesh.computeBoundingBox()
    mesh.computeBoundingSphere()
    mesh.visible = group.visible
    root.add(mesh)
    batches.push({
      prototypeKey: group.prototypeKey,
      material: 'standard',
      opacity: group.opacity,
      transparent: group.transparent,
      visible: group.visible,
      count: mesh.count,
      instancePaths: mesh.userData.instancePaths,
      geometryBounds: {
        min: geometry.boundingBox ? geometry.boundingBox.min.toArray() : null,
        max: geometry.boundingBox ? geometry.boundingBox.max.toArray() : null,
      },
      batchBounds: mesh.boundingBox
        ? { min: mesh.boundingBox.min.toArray(), max: mesh.boundingBox.max.toArray() }
        : null,
    })
    const edgePosition = edgePositions.get(group.prototypeKey)
    if (edgePosition) {
      // The edge batch shares the surface batch's matrix and colour attributes,
      // so an instance cannot drift between its fill and its wireframe.
      const edgeGeometry = new THREE.InstancedBufferGeometry()
      edgeGeometry.setAttribute('position', edgePosition)
      const matrixBuffer = new THREE.InstancedInterleavedBuffer(mesh.instanceMatrix.array, 16, 1)
      edgeGeometry.setAttribute('instanceMatrix0', new THREE.InterleavedBufferAttribute(matrixBuffer, 4, 0))
      edgeGeometry.setAttribute('instanceMatrix1', new THREE.InterleavedBufferAttribute(matrixBuffer, 4, 4))
      edgeGeometry.setAttribute('instanceMatrix2', new THREE.InterleavedBufferAttribute(matrixBuffer, 4, 8))
      edgeGeometry.setAttribute('instanceMatrix3', new THREE.InterleavedBufferAttribute(matrixBuffer, 4, 12))
      const edgeColors = mesh.instanceColor
        ? new THREE.InstancedBufferAttribute(mesh.instanceColor.array, 3)
        : new THREE.InstancedBufferAttribute(new Float32Array(mesh.count * 3).fill(0.8), 3)
      edgeGeometry.setAttribute('instanceColor', edgeColors)
      const selected = new Float32Array(mesh.count)
      const instancePaths = mesh.userData.instancePaths
      for (let index = 0; index < mesh.count; index += 1) {
        selected[index] = assemblyPreviewSelection.has(instancePaths[index]) ? 1 : 0
      }
      const selectedAttribute = new THREE.InstancedBufferAttribute(selected, 1)
      edgeGeometry.setAttribute('aSelected', selectedAttribute)
      edgeGeometry.instanceCount = mesh.count
      if (mesh.boundingBox) {
        edgeGeometry.boundingBox = mesh.boundingBox.clone()
        edgeGeometry.boundingSphere = edgeGeometry.boundingBox.getBoundingSphere(new THREE.Sphere())
      } else {
        edgeGeometry.computeBoundingSphere()
      }
      const edge = new THREE.LineSegments(edgeGeometry, edgeMaterial)
      edge.name = `assembly-preview-edges:${group.prototypeKey.slice(0, 8)}:${group.materialKey}:${group.visible ? 'visible' : 'hidden'}`
      edge.frustumCulled = true
      edge.renderOrder = 2
      edge.visible = group.visible
      edge.userData.prototypeKey = group.prototypeKey
      edge.userData.opacity = group.opacity
      edge.userData.visible = group.visible
      edge.userData.transparent = group.transparent
      edge.userData.instancePaths = instancePaths
      edge.userData.selectedAttribute = selectedAttribute
      assemblyPreviewEdgeGeometries.add(edgeGeometry)
      edgeRoot.add(edge)
      edgeMeshes.push(edge)
      edgeBatches.push({
        prototypeKey: group.prototypeKey,
        count: mesh.count,
        visible: group.visible,
        transparent: group.transparent,
        instancePaths,
      })
    }
  }
  assemblyPreviewEdgeMeshes = edgeMeshes
  if (edgeMeshes.length) {
    root.add(edgeRoot)
    assemblyPreviewEdgeGroup = edgeRoot
    window.__assemblyPreviewEdgeGroup = edgeRoot
  } else {
    edgeMaterial.dispose?.()
    assemblyPreviewEdgeMaterial = null
  }
  const pickingPrototypes = new Map()
  for (const prototype of manifest.prototypes) {
    if (!geometries.has(prototype.prototypeKey)) continue
    const arrays = arraysByKey.get(prototype.prototypeKey)
    if (!arrays) continue
    pickingPrototypes.set(prototype.prototypeKey, buildAssemblyPreviewBvh(prototype, arrays))
  }
  const pickingInstances = []
  for (const instance of manifest.instances) {
    if (!pickingPrototypes.has(instance.prototypeKey)) continue
    const instanceMatrix = new THREE.Matrix4().fromArray(instance.matrix)
    instanceMatrix.elements[12] += Number(rootOffset[0]) || 0
    instanceMatrix.elements[13] += Number(rootOffset[1]) || 0
    instanceMatrix.elements[14] += Number(rootOffset[2]) || 0
    pickingInstances.push({
      path: instance.path,
      instanceId: instance.instanceId,
      prototypeKey: instance.prototypeKey,
      visible: instance.visible !== false && !instance.suppressed,
      matrix: instanceMatrix,
      inverse: instanceMatrix.clone().invert(),
    })
  }
  assemblyPreviewPicking = {
    prototypes: pickingPrototypes,
    instances: pickingInstances,
    assemblyId: manifest.assembly?.id ?? null,
    version: manifest.assembly?.version ?? null,
  }
  scene.add(root)
  vacantGroup.visible = false
  empty.classList.remove('on')
  assemblyPreviewGroup = root
  window.__assemblyPreviewGroup = root
  const info = {
    previewKey: manifest.previewKey,
    prototypes: geometries.size,
    instances: batches.reduce((sum, batch) => sum + batch.count, 0),
    batchCount: batches.length,
    drawCalls: batches.filter((batch) => batch.visible).length,
    transparentBatches: batches.filter((batch) => batch.transparent).length,
    hiddenBatches: batches.filter((batch) => !batch.visible).length,
    opaqueBatches: batches.filter((batch) => !batch.transparent && batch.visible).length,
    rootOffset,
    frustumCulled: true,
    showEdges,
    selectedPaths: [...assemblyPreviewSelection],
    edgeBatches,
    edgeDrawCalls: showEdges ? edgeBatches.filter((batch) => batch.visible).length : 0,
    edgeInstances: edgeBatches.reduce((sum, batch) => sum + batch.count, 0),
    batches,
  }
  assemblyPreviewRenderInfo = info
  window.__assemblyPreviewRender = info
  info.xray = assemblyPreviewXray
  if (assemblyPreviewXray) applyAssemblyPreviewXray(true, [...assemblyPreviewXrayPaths])
  if (!hasFitted) {
    fit(root)
    hasFitted = true
  }
  requestRender()
  return info
}

const countFaces = (object) => {
  let count = 0
  object.traverse((child) => { if (child.isMesh) count += 1 })
  return count
}

const raycaster = new THREE.Raycaster()
const pickAt = (event) => {
  if (!display) return null
  const rect = renderer.domElement.getBoundingClientRect()
  raycaster.setFromCamera(new THREE.Vector2(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1,
  ), camera)
  const hits = raycaster.intersectObject(display, true)
    .filter((hit) => !sectionOn || sectionPlane.distanceToPoint(hit.point) >= -1e-6)
  if (!hits.length) return null
  const hit = hits[0]
  let brep = hit.brep || hit.object.userData?.brep || hit.object.userData?.face
  if (!brep && hit.object.userData?.triangleFaceIndex && hit.object.userData?.faceData) {
    const faceIndex = hit.object.userData.triangleFaceIndex[hit.faceIndex]
    brep = hit.object.userData.faceData.get(faceIndex)
  }
  let normal = null
  if (hit.face?.normal) {
    normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld)
  }
  return {
    point: [hit.point.x, hit.point.y, hit.point.z],
    normal: normal ? [normal.x, normal.y, normal.z] : null,
    area: brep?.area ?? null,
    face_index: brep?.index ?? hit.faceIndex ?? null,
  }
}

const pickupIsClick = (event, start) => {
  if (!start || event.pointerId !== start.id || event.button !== 0) return false
  const moved = Math.hypot(event.clientX - start.x, event.clientY - start.y)
  return moved <= 4 && performance.now() - start.t <= 600
}

const HANDLE_COLOR = 0x5aa7ff
const clearHandle = () => {
  if (handleGroup) {
    scene.remove(handleGroup)
    disposeObject(handleGroup)
    handleGroup = null
    requestRender()
  }
  handleInfo = null
  if (handleDrag) {
    handleDrag = null
    controls.enabled = true
  }
}

const projectScreen = (vector) => {
  const projected = vector.clone().project(camera)
  const rect = renderer.domElement.getBoundingClientRect()
  return {
    x: rect.left + (projected.x + 1) * 0.5 * rect.width,
    y: rect.top + (1 - projected.y) * 0.5 * rect.height,
  }
}

const handleValueText = (value) => {
  const unit = handleInfo?.unit ? ` ${handleInfo.unit}` : ''
  return `${handleInfo?.label || handleInfo?.param || '尺寸'}：${value}${unit}`
}

const clampHandleValue = (value) => {
  let next = Number(value)
  if (!Number.isFinite(next)) return null
  if (handleInfo?.integer) next = Math.round(next)
  else next = Math.round(next * 1000) / 1000
  if (handleInfo?.minimum != null) next = Math.max(handleInfo.minimum, next)
  if (handleInfo?.maximum != null) next = Math.min(handleInfo.maximum, next)
  return next
}

const setHandle = (payload) => {
  clearHandle()
  if (!payload?.point || !payload?.axis) return
  const point = new THREE.Vector3(...payload.point)
  const axis = new THREE.Vector3(...payload.axis)
  if (axis.lengthSq() < 1e-12) axis.set(0, 0, 1)
  axis.normalize()
  const distance = camera.position.distanceTo(point)
  const worldPerPixel = 2 * distance
    * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))
    / Math.max(renderer.domElement.clientHeight, 1)
  const length = Math.max(worldPerPixel * 90, 0.01)
  const end = point.clone().addScaledVector(axis, length)
  const group = new THREE.Group()
  const material = new THREE.LineBasicMaterial({
    color: HANDLE_COLOR, depthTest: false, transparent: true, opacity: 0.95,
  })
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([point, end]), material)
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(length * 0.07, length * 0.18, 12),
    new THREE.MeshBasicMaterial({ color: HANDLE_COLOR, depthTest: false, transparent: true }),
  )
  cone.position.copy(end.clone().addScaledVector(axis, -length * 0.09))
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), axis)
  const knob = new THREE.Mesh(
    new THREE.SphereGeometry(length * 0.085, 12, 8),
    new THREE.MeshBasicMaterial({ color: HANDLE_COLOR, depthTest: false, transparent: true }),
  )
  knob.position.copy(point)
  group.add(line, cone, knob)
  group.traverse((child) => { child.renderOrder = 30; child.frustumCulled = false })
  scene.add(group)
  handleGroup = group
  handleInfo = { ...payload, point, axis, length, worldPerPixel }
  say(`拖动 ${handleValueText(handleInfo.value)}`)
  requestRender()
}

const handleHit = (event) => {
  if (!handleInfo) return false
  const start = projectScreen(handleInfo.point)
  const end = projectScreen(handleInfo.point.clone().addScaledVector(handleInfo.axis, handleInfo.length))
  const dx = end.x - start.x
  const dy = end.y - start.y
  const length2 = dx * dx + dy * dy
  const t = length2 > 0
    ? Math.min(1, Math.max(0, ((event.clientX - start.x) * dx + (event.clientY - start.y) * dy) / length2))
    : 0
  const px = start.x + dx * t
  const py = start.y + dy * t
  return Math.hypot(event.clientX - px, event.clientY - py) <= 14
}

const beginHandleDrag = (event) => {
  if (event.button !== 0 || !handleHit(event)) return false
  const start = projectScreen(handleInfo.point)
  const end = projectScreen(handleInfo.point.clone().addScaledVector(handleInfo.axis, handleInfo.length))
  handleDrag = {
    id: event.pointerId,
    startX: event.clientX,
    startY: event.clientY,
    dirX: end.x - start.x,
    dirY: end.y - start.y,
    startValue: Number(handleInfo.value),
    value: clampHandleValue(handleInfo.value),
  }
  controls.enabled = false
  try { renderer.domElement.setPointerCapture(event.pointerId) } catch (error) { /* pointer capture is optional */ }
  say(`拖动 ${handleValueText(handleDrag.value)}`)
  return true
}

const moveHandleDrag = (event) => {
  if (!handleDrag || event.pointerId !== handleDrag.id) return
  const dx = event.clientX - handleDrag.startX
  const dy = event.clientY - handleDrag.startY
  const pixels = Math.hypot(handleDrag.dirX, handleDrag.dirY) > 0
    ? (dx * handleDrag.dirX + dy * handleDrag.dirY) / Math.hypot(handleDrag.dirX, handleDrag.dirY)
    : 0
  const next = clampHandleValue(handleDrag.startValue + pixels * handleInfo.worldPerPixel)
  if (next == null || next === handleDrag.value) return
  handleDrag.value = next
  say(`拖动 ${handleValueText(next)}`)
  post('handleMove', { value: next, param: handleInfo.param, feature_id: handleInfo.feature_id })
}

const finishHandleDrag = (event, cancel = false) => {
  if (!handleDrag) return
  const value = handleDrag.value
  const info = handleInfo
  try { renderer.domElement.releasePointerCapture(handleDrag.id) } catch (error) { /* already released */ }
  handleDrag = null
  controls.enabled = true
  if (cancel) {
    post('handleCancel', { param: info?.param, feature_id: info?.feature_id })
    say('已取消拖动')
  } else if (info && value === Number(info.value)) {
    post('handleCancel', { param: info?.param, feature_id: info?.feature_id })
    say('尺寸未改变')
  } else {
    post('handleCommit', { value, param: info?.param, feature_id: info?.feature_id })
    say(`应用 ${handleValueText(value)}`)
  }
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  if (!beginHandleDrag(event)) return
  event.preventDefault()
  event.stopImmediatePropagation()
}, true)
addEventListener('pointermove', (event) => {
  if (!handleDrag) return
  event.preventDefault()
  moveHandleDrag(event)
}, true)
addEventListener('pointerup', (event) => {
  if (!handleDrag) return
  event.preventDefault()
  event.stopImmediatePropagation()
  finishHandleDrag(event)
}, true)
addEventListener('pointercancel', (event) => {
  if (!handleDrag) return
  finishHandleDrag(event, true)
}, true)

renderer.domElement.addEventListener('pointerdown', (event) => {
  activePointers.add(event.pointerId)
  pointerStart = event.button === 0 && activePointers.size === 1
    ? { id: event.pointerId, x: event.clientX, y: event.clientY, t: performance.now() }
    : null
})
renderer.domElement.addEventListener('pointercancel', (event) => {
  activePointers.delete(event.pointerId)
  pointerStart = null
})
renderer.domElement.addEventListener('pointerup', (event) => {
  const start = pointerStart
  activePointers.delete(event.pointerId)
  pointerStart = null
  // A short left press is a selection; dragging is orbit/pan.
  if (!pickupIsClick(event, start)) return
  if (assemblyPreviewGroup && assemblyPreviewPicking) {
    const assemblyHit = pickAssemblyPreviewAt(event.clientX, event.clientY)
    if (!assemblyHit) {
      setAssemblyPreviewSelection([])
      post('pick', { pick: null })
      say('未选中几何')
      return
    }
    setAssemblyPreviewSelection([assemblyHit.instancePath])
    post('pick', {
      pick: {
        ...assemblyHit,
        scope: 'assembly',
        documentId: assemblyHit.assemblyId,
        version: assemblyHit.version,
      },
    })
    say(`拾取 ${assemblyHit.instancePath}${assemblyHit.faceKey ? ` · ${assemblyHit.faceKey}` : ''}`)
    return
  }
  if (!display) return
  const found = pickAt(event)
  if (!found) {
    post('pick', { pick: null })
    say('未选中几何')
    return
  }
  if (measureMode) {
    if (!measureA) {
      measureA = { point: new THREE.Vector3(...found.point), normal: found.normal }
      say(`起点 (${found.point.map((n) => n.toFixed(1)).join(', ')}) · 再点一处量距离`)
      return
    }
    const end = new THREE.Vector3(...found.point)
    const delta = end.clone().sub(measureA.point)
    let text = `距离 ${delta.length().toFixed(2)} mm · Δx ${delta.x.toFixed(2)} `
      + `Δy ${delta.y.toFixed(2)} Δz ${delta.z.toFixed(2)}`
    let angle = null
    if (measureA.normal && found.normal) {
      const a = new THREE.Vector3(...measureA.normal).normalize()
      const b = new THREE.Vector3(...found.normal).normalize()
      angle = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1)))
      text += ` · 夹角 ${angle.toFixed(1)}°`
    }
    say(text)
    post('measure', {
      result: {
        distance: delta.length(),
        dx: delta.x,
        dy: delta.y,
        dz: delta.z,
        angle,
        a: [measureA.point.x, measureA.point.y, measureA.point.z],
        b: found.point,
      },
    })
    measureA = null
    return
  }
  post('pick', { pick: { ...found, scope: pickScope, documentId: currentDoc, version: currentVersion } })
  say(`拾取 (${found.point.map((n) => n.toFixed(1)).join(', ')})`
    + (found.area != null ? ` · ${Number(found.area).toFixed(1)} mm²` : ''))
})

const viewKeys = { 1: 'iso', 2: 'front', 3: 'top', 4: 'right' }
addEventListener('keydown', (event) => {
  const tag = event.target?.tagName
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || event.target?.isContentEditable) return
  if (event.key === 'Escape' && handleDrag) {
    event.preventDefault()
    finishHandleDrag(event, true)
    return
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return
  const name = viewKeys[event.key]
  if (name) {
    event.preventDefault()
    setView(name)
    return
  }
  const key = event.key.toLowerCase()
  if (key === 'f') {
    event.preventDefault()
    if (display) fit(display)
    return
  }
  if (key === 'e') {
    event.preventDefault()
    setShowEdges()
    return
  }
  if (event.key === 'Escape') {
    post('pick', { pick: null })
    clearHighlight()
  }
})

addEventListener('message', (event) => {
  const data = event.data
  if (!data || data.from !== 'brepx-workbench') return
  if (data.type === 'ping') {
    // The workbench attaches its listener after this frame may already have sent
    // its first ready message; answer a late ping so the handshake is idempotent.
    post('ready', {})
    return
  }
  if (data.type === 'clear') {
    previewAbort?.abort()
    previewAbort = null
    cancelAssemblyPreview()
    currentDoc = null
    currentVersion = 0
    previewActive = false
    clearHighlight()
    disposeObject(display)
    display = null
    clearGhost()
    vacantGroup.visible = true
    empty.classList.add('on')
    hasFitted = false
    controls.target.set(0, 0, 0)
    camera.position.set(110, -110, 82)
    camera.updateProjectionMatrix()
    controls.update()
    say('空白文档')
    requestRender()
    post('cleared', {})
  } else if (data.type === 'design') {
    showVersion(data.documentId, data.version, { fit: data.fit, highlight: data.highlight })
  } else if (data.type === 'preview') {
    showPreview(data.url, data.label)
  } else if (data.type === 'assembly-preview') {
    loadAssemblyPreview(data)
  } else if (data.type === 'assembly-xray') {
    applyAssemblyPreviewXray(data.on !== false, data.paths || [])
  } else if (data.type === 'ghost') {
    if (data.on === false || !data.version) { clearGhost(); say('残影关闭') }
    else showGhost(data.documentId || currentDoc, data.version)
  } else if (data.type === 'highlight') {
    if (data.centers?.length) highlightFaces(data.centers, data.seconds ?? 3.2, data.tone)
    else clearHighlight()
  } else if (data.type === 'view') {
    setView(data.name)
  } else if (data.type === 'fit') {
    if (display) fit(display)
  } else if (data.type === 'scope') {
    pickScope = ['body', 'face', 'edge', 'point'].includes(data.scope) ? data.scope : 'face'
    say(`选择范围：${{ body: '实体', face: '面', edge: '边', point: '点' }[pickScope]}`)
  } else if (data.type === 'handle') {
    setHandle(data.axis ? data : null)
  } else if (data.type === 'wire') {
    wire = typeof data.on === 'boolean' ? data.on : !wire
    applyWire()
  } else if (data.type === 'show-edges') {
    setShowEdges(typeof data.on === 'boolean' ? data.on : undefined)
  } else if (data.type === 'measure') {
    measureMode = typeof data.on === 'boolean' ? data.on : !measureMode
    measureA = null
    say(measureMode ? '测量已开启：点两处取距离与夹角' : '测量已关闭')
  } else if (data.type === 'section') {
    if (typeof data.on === 'boolean') sectionOn = data.on
    if (data.axis) sectionAxis = data.axis
    if (typeof data.t === 'number') sectionT = Math.min(Math.max(data.t, 0), 1)
    applySection()
  } else if (data.type === 'resize') {
    resize()
  } else if (data.type === 'theme') {
    applyPalette(data)
  }
})

const resize = () => {
  const width = host.clientWidth || 1
  const height = host.clientHeight || 1
  renderer.setSize(width, height, false)
  camera.aspect = width / height
  camera.updateProjectionMatrix()
  requestRender()
}
addEventListener('resize', resize)
const resizeObserver = new ResizeObserver(resize)
resizeObserver.observe(host)

let frameCount = 0
let lastFrameError = null
let frameHandle = 0
let dirty = true

const scheduleFrame = () => {
  if (frameHandle) return
  if (document.visibilityState !== 'visible') return
  frameHandle = requestAnimationFrame(frame)
}

// Rendering follows state changes: an idle viewport must not keep the GPU busy,
// while damping and pointer interaction need consecutive frames until they settle.
const requestRender = () => {
  dirty = true
  scheduleFrame()
}

const frame = () => {
  frameHandle = 0
  let moved = false
  try {
    moved = controls.update()
  } catch (error) {
    lastFrameError = error.message
  }
  if (!dirty && !moved) return
  try {
    renderer.render(scene, camera)
    dirty = false
    frameCount += 1
  } catch (error) {
    lastFrameError = error.message
    dirty = false
  }
  if (dirty || moved) scheduleFrame()
}

controls.addEventListener('change', requestRender)

addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestRender()
  else if (frameHandle) {
    cancelAnimationFrame(frameHandle)
    frameHandle = 0
  }
})

const loadKernel = () => {
  if (kernelTask) return kernelTask
  kernelTask = (async () => {
    const response = await fetch('/api/kernel/smlibwasm.wasm')
    if (!response.ok) throw new Error(`KERNEL ${response.status}`)
    const payload = await response.arrayBuffer()
    kernel = await init({ wasmBinary: payload })
    window.__kernelReady = true
    return kernel
  })()
  kernelTask.catch((error) => {
    kernelError = error
    kernelTask = null
    say(`内核初始化失败：${error.message}`)
  })
  return kernelTask
}

const ensureKernel = () => {
  if (kernel) return Promise.resolve(kernel)
  if (kernelError) return Promise.reject(kernelError)
  return loadKernel()
}

const start = () => {
  resize()
  requestRender()
  // The scene path draws without the kernel, so readiness must not wait for the
  // 9.4 MB wasm: only STEP parsing, ghost and preview await it.
  post('ready', {})
  ensureKernel().catch(() => {})
}

start()
</script>
</body>
</html>
