<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trunk case</title>
<style>
  :root { color-scheme: light; --ok:#0a7a3d; --bad:#b42318; --muted:#667085; --line:#e4e7ec; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color:#101828; background:#f8fafc; }
  header { position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid var(--line); padding:12px 18px; }
  h1 { margin:0 0 6px; font-size:18px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; padding:7px 14px; border:1px solid #344054; border-radius:6px; background:#101828; color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .muted { color:var(--muted); }
  .ok { color:var(--ok); font-weight:700; }
  .bad { color:var(--bad); font-weight:700; }
  main { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:14px; padding:16px; }
  .turn { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; }
  .turn.failed { border-color:#fda29b; }
  .turn h2 { margin:0 0 4px; font-size:14px; }
  .intent { font-weight:700; margin-bottom:8px; }
  .turn img { width:100%; border:1px solid #eef2f6; border-radius:4px; background:#fff; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  code { font-size:12px; }
  a { color:#175cd3; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>Trunk case: intent → plan → build → recover → edit</h1>
  <div class="bar">
    <button id="run" onclick="runCase()">Run 5-turn case</button>
    <span id="status" class="muted">idle</span>
    <span class="muted">板 + 孔 → 凸台 → 圆角失败 → 修复 → 改孔径增量重算。</span>
  </div>
</header>
<main id="turns"></main>
<script>
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}

function nodeRows(nodes) {
  return nodes.map(node => `<tr><td><code>${escapeHtml(node.id)}</code></td>
    <td>${escapeHtml(node.kind)}</td><td class="${node.status === "done" ? "ok" : "bad"}">${escapeHtml(node.status)}</td></tr>`).join("");
}

function renderTurns(payload) {
  const root = document.getElementById("turns");
  root.innerHTML = "";
  for (const turn of payload.turns) {
    const failed = Boolean(turn.error);
    const card = document.createElement("section");
    card.className = "turn" + (failed ? " failed" : "");
    const lines = [];
    lines.push(`<h2>Turn ${turn.turn} · version ${turn.version}</h2>`);
    lines.push(`<div class="intent">${escapeHtml(turn.intent)}</div>`);
    if (turn.png_url) lines.push(`<a href="${turn.png_url}" target="_blank"><img src="${turn.png_url}" alt="turn ${turn.turn}"></a>`);
    if (failed) lines.push(`<p class="bad">${escapeHtml(turn.error)}</p>`);
    if (turn.version_after_failure !== undefined) lines.push(`<p class="muted">failed version stays ${turn.version_after_failure}</p>`);
    if (turn.metrics) lines.push(`<p class="muted">${escapeHtml(JSON.stringify(turn.metrics))}</p>`);
    lines.push(`<table><thead><tr><th>node</th><th>kind</th><th>status</th></tr></thead><tbody>${nodeRows(turn.nodes)}</tbody></table>`);
    const links = [];
    if (turn.png) links.push(`<a href="/case-evidence/${payload.run_id}/${turn.png}" target="_blank">png</a>`);
    if (turn.step) links.push(`<a href="/case-evidence/${payload.run_id}/${turn.step}" target="_blank">step</a>`);
    links.push(`<a href="/case-evidence/${payload.run_id}/turn-${turn.turn}.json" target="_blank">json</a>`);
    lines.push(`<p class="muted">${links.join(" · ")}</p>`);
    card.innerHTML = lines.join("");
    root.appendChild(card);
  }
  document.getElementById("status").innerHTML =
    `<span class="ok">${payload.turns.length} turns</span> · final version ${payload.final_version} · run <code>${payload.run_id}</code>`;
  document.body.dataset.done = "1";
  document.body.dataset.runId = payload.run_id;
}

async function runCase() {
  const button = document.getElementById("run");
  button.disabled = true;
  document.getElementById("status").textContent = "running...";
  try {
    const response = await fetch("/api/case/run", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || ("HTTP " + response.status));
    renderTurns(payload);
  } catch (error) {
    document.getElementById("status").innerHTML = `<span class="bad">${escapeHtml(error.message)}</span>`;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
